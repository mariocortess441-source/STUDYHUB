<title>ROOM — Tu espacio personal</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#101729;--line:#273550;--text:#edf3ff;--muted:#9eacc4;--cyan:#55e6ff;--violet:#a78bfa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
#app{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(ellipse at 50% 30%,#1a2340 0%,#080b16 70%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;z-index:3;top:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{pointer-events:auto;font-size:12px;letter-spacing:.3em;font-weight:900;color:#fff}.brand span{color:var(--cyan)}.topnote{font-size:11px;color:#aab8d0;letter-spacing:.12em;text-transform:uppercase}
.hint{position:absolute;z-index:2;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 15px;border:1px solid #52648166;background:#101729bd;backdrop-filter:blur(14px);border-radius:999px;color:#d6e4ff;font-size:12px;white-space:nowrap;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}.tag{position:absolute;transform:translate(-50%,-50%);padding:6px 9px;border:1px solid #8ca6c455;border-radius:8px;background:#0b1222c9;color:#eaf4ff;font-size:11px;letter-spacing:.04em;white-space:nowrap;backdrop-filter:blur(8px);transition:opacity .2s}
#panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:28px;background:#030713b8;backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#panel.open{opacity:1;visibility:visible}
.panel-shell{width:min(820px,100%);height:min(790px,calc(100dvh - 56px));display:flex;flex-direction:column;overflow:hidden;border:1px solid #435879;background:linear-gradient(145deg,#17243bfa,#0a1120fc);border-radius:28px;box-shadow:0 35px 110px #000c;transform:translateY(18px) scale(.985);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:30px}
#panel.open .panel-shell{transform:translateY(0) scale(1)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid #34445f}
.panel-heading{min-width:0}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:900}
.panel-title{font-size:clamp(32px,5vw,48px);letter-spacing:-.045em;line-height:1.02;margin:9px 0 10px;color:#f5f8ff}
.panel-desc{font-size:14px;color:#aab8d0;line-height:1.55;margin:0;max-width:620px}
.close{flex:0 0 42px;border:1px solid #40516e;background:#1b2942;color:#fff;border-radius:13px;width:42px;height:42px;font-size:24px;cursor:pointer;transition:.2s}
.close:hover{background:#334764;transform:rotate(90deg)}
.panel-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:17px 0 12px;flex-wrap:wrap}

#items{overflow:auto;flex:1;min-height:80px;padding:2px 4px 8px 0}

.entry:hover{border-color:#6684a9;transform:translateY(-1px)}.entry input[type=checkbox]{accent-color:var(--cyan);margin-top:4px;width:16px;height:16px}

.entry-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.entry small{color:#91a2bd;font-size:10px}.priority{font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:#25334a;color:#bcd2ed}
.entry-actions{display:flex;gap:5px}.remove,.edit{border:1px solid #34445f;background:#17243a;color:#aebbd0;border-radius:8px;font-size:14px;cursor:pointer;padding:5px 8px}.remove:hover{color:#ff9b9b;border-color:#a65d6a}.edit:hover{color:var(--cyan)}
.add{display:grid;grid-template-columns:minmax(0,1fr) 145px auto;gap:8px;margin-top:15px;padding-top:16px;border-top:1px solid #34445f}
.add input,.add select{min-width:0;background:#080f1e;border:1px solid #34445f;color:white;border-radius:11px;padding:12px;font-size:12px;outline:none}.add input:focus,.add select:focus{border-color:var(--cyan)}
.add button,.action{border:0;border-radius:11px;background:linear-gradient(135deg,#58ddf3,#8d8bff);color:#08111f;font-weight:900;padding:0 18px;cursor:pointer}
.panel-foot{display:flex;justify-content:space-between;align-items:center;color:#7787a3;font-size:10px;margin-top:12px;gap:10px}
#toast{position:absolute;z-index:15;bottom:70px;left:50%;transform:translate(-50%,12px);opacity:0;background:#dffbff;color:#06121a;padding:10px 15px;border-radius:10px;font-size:12px;font-weight:700;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}

</style>

 bed:[bed,new THREE.Vector3(-2.85,1.1,1.5)],calendar:[wallCalendar,new THREE.Vector3(-4.72,2.55,-1.55)],desk:[deskHit,new THREE.Vector3(.1,1.85,-2.82)],pc:[desk,new THREE.Vector3(-.1,2.4,-2.9)],books:[shelf,new THREE.Vector3(3.55,2.8,-3.5)],wardrobe:[wardrobe,new THREE.Vector3(4.28,2.8,.15)],window:[windowG,new THREE.Vector3(-2.7,2.55,-3.7)],voide:[picture,new THREE.Vector3(1.75,2.85,-3.65)],chair:[chair,new THREE.Vector3(1.9,1.7,-1.8)],bin:[bin,new THREE.Vector3(3,.7,2.7)]
};
const clickables=[];for(const [id,[g]] of Object.entries(targets)){g.traverse(o=>{if(o.isMesh){o.userData.targetId=id;clickables.push(o)}})}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let active=null,drag=null,lastX=0,lastY=0,down=false,labelsMap={};
const panel=document.querySelector('#panel'),itemsEl=document.querySelector('#items'),input=document.querySelector('#new-item'),toastEl=document.querySelector('#toast');
let accountSync=false,syncTimer=null;
function data(){try{return JSON.parse(localStorage.getItem('room-data-v1')||'{}')}catch{return {}}}
function save(d){localStorage.setItem('room-data-v1',JSON.stringify(d));const status=document.querySelector('#save-status');if(accountSync){status.textContent='GUARDANDO EN TU CUENTA…';clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{try{const r=await fetch('/api/study-data/room',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({value:d})});if(!r.ok)throw Error('sync');status.textContent='SINCRONIZADO CON TU CUENTA'}catch{status.textContent='GUARDADO EN ESTE DISPOSITIVO'}},450)}}
async function initializeStorage(){try{const me=await fetch('/api/auth/me',{credentials:'same-origin'});if(!me.ok)return;const payload=await me.json();if(!payload.user)return;const remote=await fetch('/api/study-data',{credentials:'same-origin'});if(!remote.ok)return;const cloud=(await remote.json()).data?.room;if(cloud&&typeof cloud==='object'){localStorage.setItem('room-data-v1',JSON.stringify(cloud))}else{const local=data();if(Object.keys(local).length)await fetch('/api/study-data/room',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({value:local})})}accountSync=true;document.querySelector('#save-status').textContent='SINCRONIZADO CON TU CUENTA';if(active)renderItems()}catch{document.querySelector('#save-status').textContent='GUARDADO EN ESTE DISPOSITIVO'}}
function showToast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1700)}
let currentFilter='all';
function openPanel(id){active=id;currentFilter='all';const def=objectDefs.find(x=>x[0]===id);if(!def)return;document.querySelector('#panel-kicker').textContent=def[4]+'  ROOM · '+def[1].toUpperCase();document.querySelector('#panel-title').textContent=def[2];document.querySelector('#panel-desc').textContent=def[3];document.querySelector('#new-item').placeholder=def[5];document.querySelector('#search-item').value='';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));const quick=document.querySelector('#quick-actions');quick.innerHTML='';def[6].forEach(label=>{const b=document.createElement('button');b.className='quick';b.textContent='+ '+label;b.addEventListener('click',()=>addItem(label));quick.append(b)});panel.classList.add('open');panel.setAttribute('aria-hidden','false');renderItems();setTimeout(()=>input.focus({preventScroll:true}),180)}
function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');active=null}
function addItem(value){if(!value||!active)return;const d=data();d[active]=d[active]||[];d[active].unshift({text:value,done:false,priority:document.querySelector('#new-priority').value,date:new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'}).format(new Date())});save(d);input.value='';renderItems();showToast('Guardado en '+objectDefs.find(x=>x[0]===active)[2])}
function renderItems(){if(!active)return;const all=data(),list=all[active]||[],query=document.querySelector('#search-item').value.trim().toLocaleLowerCase('es');const filtered=list.map((item,i)=>({...item,_index:i})).filter(item=>(currentFilter==='all'||(currentFilter==='done'?item.done:!item.done))&&item.text.toLocaleLowerCase('es').includes(query));itemsEl.innerHTML='';document.querySelector('#count').textContent=list.length+' ELEMENTOS · '+list.filter(x=>x.done).length+' HECHOS';if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent=list.length?'No hay elementos que coincidan con este filtro.':'Este espacio está esperando a que lo llenes. Añade tu primer elemento o utiliza una sugerencia de arriba.';itemsEl.append(e);return}filtered.forEach(item=>{const i=item._index,row=document.createElement('div');row.className='entry'+(item.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label','Marcar como completado');check.addEventListener('change',()=>{const d=data();d[active][i].done=check.checked;save(d);renderItems()});const main=document.createElement('div');main.className='entry-main';const text=document.createElement('div');text.className='entry-text';text.textContent=item.text;const meta=document.createElement('div');meta.className='entry-meta';const date=document.createElement('small');date.textContent=item.date||'Añadido';meta.append(date);if(item.priority){const p=document.createElement('span');p.className='priority';p.textContent=item.priority;meta.append(p)}main.append(text,meta);const actions=document.createElement('div');actions.className='entry-actions';const edit=document.createElement('button');edit.className='edit';edit.textContent='Editar';edit.addEventListener('click',()=>{const next=prompt('Editar elemento',item.text);if(next===null||!next.trim())return;const d=data();d[active][i].text=next.trim().slice(0,140);save(d);renderItems()});const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','Eliminar elemento');del.addEventListener('click',()=>{const d=data();d[active].splice(i,1);save(d);renderItems();showToast('Elemento eliminado')});actions.append(edit,del);row.append(check,main,actions);itemsEl.append(row)})}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderItems()}));
document.querySelector('#search-item').addEventListener('input',renderItems);
document.querySelector('#add-form').addEventListener('submit',e=>{e.preventDefault();addItem(input.value.trim())});
document.querySelector('#close').addEventListener('click',closePanel);panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});addEventListener('keydown',e=>{if(e.key==='Escape'&&active)closePanel()});
function project(v){return v.clone().project(camera)}
function makeLabels(){labels.innerHTML='';for(const [id,def] of objectDefs){const el=document.createElement('div');el.className='tag';el.textContent='·';el.setAttribute('aria-label',def[1]);el.style.width='9px';el.style.height='9px';el.style.padding='0';el.style.borderRadius='50%';el.style.fontSize='0';el.style.background='#d9f7ff';el.style.border='1px solid #ffffffaa';el.style.boxShadow='0 0 10px #55e6ff88';labels.append(el);labelsMap[id]=el}}
makeLabels();
function positionLabels(){for(const [id,[g,p]] of Object.entries(targets)){const el=labelsMap[id];const q=project(p);const x=(q.x*.5+.5)*innerWidth,y=(-q.y*.5+.5)*innerHeight;const visible=q.z<1&&q.z>-1&&x>0&&x<innerWidth&&y>0&&y<innerHeight;el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=visible?(active===id?'0':'1'):'0'}}
function choose(clientX,clientY){pointer.x=clientX/innerWidth*2-1;pointer.y=-(clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(clickables,false);if(hits.length){const id=hits[0].object.userData.targetId;if(id)openPanel(id)}}
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;drag={x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down&&!panel.classList.contains('open')){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);canvas.style.cursor=raycaster.intersectObjects(clickables,false).length?'pointer':'grab'}if(!down||panel.classList.contains('open'))return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>5)drag.moved=true;lastX=e.clientX;lastY=e.clientY;if(drag.moved){camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.004);camera.position.y=Math.max(3.4,Math.min(9,camera.position.y+dy*.012));camera.lookAt(0,1.6,0)}});
canvas.addEventListener('pointerup',e=>{if(down&&drag&&!drag.moved&&!panel.classList.contains('open'))choose(e.clientX,e.clientY);down=false;drag=null});
canvas.addEventListener('wheel',e=>{if(panel.classList.contains('open'))return;camera.position.multiplyScalar(e.deltaY>0?1.06:.94);const len=camera.position.length();if(len<8)camera.position.setLength(8);if(len>17)camera.position.setLength(17);camera.lookAt(0,1.6,0)},{passive:true});
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;cyan.intensity=20+Math.sin(t*1.4)*2;violet.intensity=17+Math.sin(t*1.1+1)*2;renderer.render(scene,camera);positionLabels()}animate();
initializeStorage();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
