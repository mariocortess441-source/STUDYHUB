<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b16"><meta name="description" content="Tu espacio personal en 3D: organiza proyectos, estudios, ideas y vida desde tu habitación.">
<title>ROOM — Tu espacio personal</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#101729;--line:#273550;--text:#edf3ff;--muted:#9eacc4;--cyan:#55e6ff;--violet:#a78bfa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
#app{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(ellipse at 50% 30%,#1a2340 0%,#080b16 70%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;z-index:3;top:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{pointer-events:auto;font-size:12px;letter-spacing:.3em;font-weight:900;color:#fff}.brand span{color:var(--cyan)}.topnote{font-size:11px;color:#aab8d0;letter-spacing:.12em;text-transform:uppercase}
.hint{position:absolute;z-index:2;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 15px;border:1px solid #52648166;background:#101729bd;backdrop-filter:blur(14px);border-radius:999px;color:#d6e4ff;font-size:12px;white-space:nowrap;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}.tag{position:absolute;transform:translate(-50%,-50%);padding:6px 9px;border:1px solid #8ca6c455;border-radius:8px;background:#0b1222c9;color:#eaf4ff;font-size:11px;letter-spacing:.04em;white-space:nowrap;backdrop-filter:blur(8px);transition:opacity .2s}
#panel{position:absolute;z-index:5;right:18px;top:18px;bottom:18px;width:min(390px,calc(100% - 36px));background:linear-gradient(160deg,#141e33f5,#0b1120f5);border:1px solid #40516e88;border-radius:22px;box-shadow:0 24px 90px #0009;backdrop-filter:blur(22px);padding:22px;display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#panel.open{transform:translateX(0)}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:800}.panel-title{font-size:26px;line-height:1.1;margin:7px 0 6px}.panel-desc{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}.close{border:1px solid var(--line);background:#172239;color:#fff;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
#items{overflow:auto;flex:1;min-height:70px;padding-right:3px}.empty{border:1px dashed #52617b;border-radius:14px;padding:18px;color:var(--muted);font-size:13px;line-height:1.5;text-align:center;margin-top:8px}.entry{display:flex;gap:10px;align-items:flex-start;border:1px solid #283750;background:#121d31;border-radius:13px;padding:11px 12px;margin-bottom:8px}.entry input[type=checkbox]{accent-color:var(--cyan);margin-top:3px}.entry-main{flex:1;min-width:0}.entry-text{font-size:13px;overflow-wrap:anywhere}.entry.done .entry-text{text-decoration:line-through;color:#8492a9}.entry small{display:block;color:#8492a9;font-size:10px;margin-top:5px}.remove{border:0;background:transparent;color:#8292ad;font-size:17px;cursor:pointer;padding:0 2px}
.add{display:flex;gap:8px;margin-top:14px}.add input{min-width:0;flex:1;background:#080f1e;border:1px solid #34445f;color:white;border-radius:11px;padding:12px;font-size:13px;outline:none}.add input:focus{border-color:var(--cyan)}.add button,.action{border:0;border-radius:11px;background:linear-gradient(135deg,#58ddf3,#8d8bff);color:#08111f;font-weight:800;padding:0 15px;cursor:pointer}.panel-foot{display:flex;justify-content:space-between;align-items:center;color:#7787a3;font-size:10px;margin-top:12px}
#toast{position:absolute;z-index:7;bottom:70px;left:50%;transform:translate(-50%,12px);opacity:0;background:#dffbff;color:#06121a;padding:10px 15px;border-radius:10px;font-size:12px;font-weight:700;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.topbar{padding:15px 16px}.topnote{display:none}.hint{bottom:12px;font-size:10px;max-width:calc(100% - 24px);text-align:center}#panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:min(65%,520px);border-radius:20px;transform:translateY(calc(100% + 20px));padding:18px}#panel.open{transform:translateY(0)}.panel-title{font-size:23px}.tag{font-size:9px;padding:5px 7px}}
</style>
</head>
<body><main id="app"><canvas id="scene" aria-label="Habitación 3D interactiva"></canvas><header class="topbar"><div class="brand">ROOM<span>.</span></div><div class="topnote">TU ESPACIO · TUS PLANES · TU VIDA</div></header><div id="labels"></div><div class="hint">Pulsa sobre los objetos para entrar en cada espacio</div><aside id="panel" aria-live="polite"><div class="panel-head"><div><div class="eyebrow" id="panel-kicker">TU ESPACIO</div><h1 class="panel-title" id="panel-title">Estudios</h1></div><button class="close" id="close" aria-label="Cerrar">×</button></div><p class="panel-desc" id="panel-desc"></p><div id="items"></div><form class="add" id="add-form"><input id="new-item" maxlength="140" placeholder="Añadir una idea..." autocomplete="off"><button type="submit">Añadir</button></form><div class="panel-foot"><span>SE GUARDA AUTOMÁTICAMENTE</span><span id="count">0 ELEMENTOS</span></div></aside><div id="toast"></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene'),labels=document.querySelector('#labels');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d1b);scene.fog=new THREE.Fog(0x080d1b,13,25);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(8,6.8,10);camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xa9c7ff,0x222033,2.0));const key=new THREE.DirectionalLight(0xffe4c6,3.1);key.position.set(-4,9,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const cyan=new THREE.PointLight(0x35dfff,22,10);cyan.position.set(0,3.8,-3.7);scene.add(cyan);const violet=new THREE.PointLight(0x9164ff,18,9);violet.position.set(4,3,0);scene.add(violet);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const wall=mat(0x18243a),side=mat(0x111a2d),floorMat=mat(0x252c3d),wood=mat(0x68452f),wood2=mat(0x936544),black=mat(0x101522,.35),fabric=mat(0x354866),white=mat(0xcbd6e8),glow=mat(0x4be5ff,.3,0.1),purple=mat(0x8566ef,.35);
function box(parent,name,pos,size,material,opts={}){const o=new THREE.Mesh(new THREE.BoxGeometry(...size),material);o.position.set(...pos);o.castShadow=true;o.receiveShadow=true;o.name=name;if(opts.rot)o.rotation.set(...opts.rot);parent.add(o);return o}
function group(name,pos=[0,0,0]){const g=new THREE.Group();g.name=name;g.position.set(...pos);scene.add(g);return g}
const floor=box(scene,'floor',[0,-.12,0],[10,.24,8],floorMat);const back=box(scene,'back-wall',[0,2,-4],[10,4,.18],wall);const left=box(scene,'left-wall',[-5,2,0],[.18,4,8],side);const right=box(scene,'right-wall',[5,2,0],[.18,4,8],side);
for(let i=0;i<8;i++)box(scene,'floor-board',[0,.006,-3.45+i*.95],[9.8,.015,.018],mat(0x536078));
const ceiling=box(scene,'ceiling',[0,4.08,0],[10,.12,8],mat(0x0c1323));
const rug=group('Alfombra',[0,.02,1.05]);box(rug,'rug',[0,0,0],[4.4,.05,2.7],mat(0x293b5c));for(let i=0;i<5;i++)box(rug,'rug-line',[0,.029,-1+i*.5],[4.15,.008,.018],mat(0x627da5));
const bed=group('Cama',[-2.85,0,1.55]);box(bed,'bed-base',[0,.38,0],[2.5,.55,3.2],wood);box(bed,'mattress',[0,.78,0],[2.55,.28,3.2],white);box(bed,'duvet',[0,.96,.5],[2.5,.12,2.1],fabric);box(bed,'pillow',[-.55,1.0,-1.1],[.85,.18,.65],white);box(bed,'pillow',[.55,1.0,-1.1],[.85,.18,.65],white);box(bed,'headboard',[0,1.05,-1.65],[2.65,1.25,.16],wood2);
const desk=group('Escritorio',[-.1,0,-2.65]);box(desk,'desk-top',[0,1.65,0],[3.3,.16,1.25],wood2);for(const x of [-1.42,1.42])box(desk,'desk-leg',[x,.83,0],[.13,1.55,.13],black);box(desk,'drawer',[0,1.35,.35],[1.1,.38,.55],wood);
const monitor=group('Ordenador',[0,0,0]);box(desk,'monitor',[0,2.35,-.35],[1.65,1.12,.12],black);box(desk,'screen',[0,2.35,-.275],[1.48,.92,.018],mat(0x122b47,.25));box(desk,'screen-glow',[0,2.35,-.26],[1.24,.06,.02],glow);box(desk,'monitor-stand',[0,1.83,-.35],[.12,.35,.12],black);box(desk,'keyboard',[0,1.78,.35],[1.2,.06,.35],black);
const chair=group('Silla gamer',[0,0,0]);box(chair,'chair-seat',[1.9,.82,-1.5],[.9,.2,.9],black);box(chair,'chair-back',[1.9,1.55,-1.9],[.9,1.35,.2],fabric);box(chair,'chair-pillow',[1.9,1.8,-1.77],[.42,.22,.12],purple);box(chair,'chair-pole',[1.9,.35,-1.5],[.12,.75,.12],black);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;box(chair,'chair-foot',[1.9+Math.cos(a)*.35,.08,-1.5+Math.sin(a)*.35],[.55,.09,.1],black,{rot:[0,-a,0]})}
const shelf=group('Estantería',[3.55,0,-3.55]);box(shelf,'shelf-frame',[0,1.65,0],[1.65,3.3,.42],wood);for(let y of [.5,1.35,2.2,3.05])box(shelf,'shelf-board',[0,y,.25],[1.55,.09,.58],wood2);const bookColors=[0x3d6d94,0x9b5b54,0x65866f,0xb18a4d,0x7667a5,0x527d8b];for(let row=0;row<3;row++)for(let i=0;i<5;i++){const h=.42+(i%3)*.1;box(shelf,'book',[ -.58+i*.27,.79+row*.85+h/2,.02],[.19,h,.32],mat(bookColors[(i+row)%bookColors.length]))}
const wardrobe=group('Armario',[4.05,0,.4]);box(wardrobe,'wardrobe-body',[0,1.55,0],[1.55,3.1,1.05],wood);box(wardrobe,'wardrobe-left',[-.38,1.55,.55],[.74,2.95,.07],wood2);box(wardrobe,'wardrobe-right',[.38,1.55,.55],[.74,2.95,.07],wood2);for(let x of [-.07,.07]){const knob=new THREE.Mesh(new THREE.SphereGeometry(.045,12,12),glow);knob.position.set(x,1.55,.62);wardrobe.add(knob)}
const windowG=group('Ventana',[-2.7,2.55,-3.86]);box(windowG,'window-frame',[0,0,0],[2.5,1.8,.18],wood2);box(windowG,'window-glass',[0,0,.1],[2.28,1.58,.04],mat(0x1b5274,.2));box(windowG,'window-cross-v',[0,0,.14],[.06,1.6,.04],white);box(windowG,'window-cross-h',[0,0,.14],[2.3,.06,.04],white);const outside=new THREE.PointLight(0x64caff,8,7);outside.position.set(-2.7,2.7,-2.9);scene.add(outside);
const picture=group('VOIDE',[1.75,2.85,-3.82]);box(picture,'frame',[0,0,0],[1.35,1.05,.12],wood2);box(picture,'canvas',[0,0,.08],[1.18,.88,.03],black);const vText=box(picture,'voide-mark',[0,0,.12],[.68,.12,.025],white);const slash=box(picture,'voide-slash',[0,0,.15],[.08,.62,.025],glow,{rot:[0,0,.45]});
const bin=group('Papelera',[3.0,0,2.7]);const binMesh=new THREE.Mesh(new THREE.CylinderGeometry(.32,.25,.65,20),black);binMesh.position.y=.33;binMesh.castShadow=true;bin.add(binMesh);box(bin,'bin-rim',[0,.67,0],[.65,.07,.65],wood2);
const lamp=group('Lámpara',[1.35,0,-2.8]);box(lamp,'lamp-base',[0,.12,0],[.48,.12,.48],black);box(lamp,'lamp-stem',[0,.72,0],[.07,1.15,.07],wood2);const shade=new THREE.Mesh(new THREE.ConeGeometry(.38,.42,24,1,true),glow);shade.position.set(0,1.35,0);shade.rotation.x=Math.PI;lamp.add(shade);
const objectDefs=[
 ['bed','Cama','Descanso y planes personales','Cosas que quiero hacer para descansar, desconectar y disfrutar.'],
 ['desk','Estudios','Apuntes, tareas y objetivos académicos','Organiza asignaturas, tareas, exámenes y objetivos de estudio.'],
 ['pc','Proyectos','Ideas y proyectos en marcha','Un espacio para desarrollar ideas, productos y proyectos digitales.'],
 ['books','Lecturas','Libros que quiero leer','Guarda libros pendientes, lecturas actuales y notas.'],
 ['wardrobe','Ropa','Ropa que quiero comprar','Tu lista de prendas, ideas de conjuntos y compras pendientes.'],
 ['window','Experiencias','Planes fuera y naturaleza','Lugares, viajes, rutas y experiencias que quiero vivir.'],
 ['voide','VOIDE','Tu marca y universo creativo','Diseños, lanzamientos, contenido y próximos pasos de VOIDE.'],
 ['chair','Hábitos','Rutinas y hábitos','Pequeños hábitos que quiero construir y mantener.'],
 ['bin','Bandeja de ideas','Ideas rápidas','Apunta ideas sueltas y decide después dónde van.']
];
const targets={
 bed:[bed,new THREE.Vector3(-2.85,1.1,1.5)],desk:[desk,new THREE.Vector3(-.1,2.3,-2.7)],pc:[desk,new THREE.Vector3(-.1,2.4,-2.9)],books:[shelf,new THREE.Vector3(3.55,2.8,-3.5)],wardrobe:[wardrobe,new THREE.Vector3(4.05,2.8,.4)],window:[windowG,new THREE.Vector3(-2.7,2.55,-3.7)],voide:[picture,new THREE.Vector3(1.75,2.85,-3.65)],chair:[chair,new THREE.Vector3(1.9,1.7,-1.8)],bin:[bin,new THREE.Vector3(3,.7,2.7)]
};
const clickables=[];for(const [id,[g]] of Object.entries(targets)){g.traverse(o=>{if(o.isMesh){o.userData.targetId=id;clickables.push(o)}})}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let active=null,drag=null,lastX=0,lastY=0,down=false,labelsMap={};
const panel=document.querySelector('#panel'),itemsEl=document.querySelector('#items'),input=document.querySelector('#new-item'),toastEl=document.querySelector('#toast');
function data(){try{return JSON.parse(localStorage.getItem('room-data-v1')||'{}')}catch{return {}}}
function save(d){localStorage.setItem('room-data-v1',JSON.stringify(d))}
function showToast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1700)}
function openPanel(id){active=id;const def=objectDefs.find(x=>x[0]===id);if(!def)return;document.querySelector('#panel-kicker').textContent='TU HABITACIÓN · '+def[1].toUpperCase();document.querySelector('#panel-title').textContent=def[2];document.querySelector('#panel-desc').textContent=def[3];panel.classList.add('open');renderItems();input.focus({preventScroll:true})}
function renderItems(){const all=data(),list=all[active]||[];itemsEl.innerHTML='';document.querySelector('#count').textContent=list.length+' ELEMENTOS';if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Todavía no hay nada aquí. Añade tu primera idea y empieza a construir este espacio.';itemsEl.append(e);return}list.forEach((item,i)=>{const row=document.createElement('div');row.className='entry'+(item.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label','Marcar como completado');check.addEventListener('change',()=>{const d=data();d[active][i].done=check.checked;save(d);renderItems()});const main=document.createElement('div');main.className='entry-main';const text=document.createElement('div');text.className='entry-text';text.textContent=item.text;const small=document.createElement('small');small.textContent=item.date||'Añadido';main.append(text,small);const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','Eliminar elemento');del.addEventListener('click',()=>{const d=data();d[active].splice(i,1);save(d);renderItems();showToast('Elemento eliminado')});row.append(check,main,del);itemsEl.append(row)})}
document.querySelector('#add-form').addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value||!active)return;const d=data();d[active]=d[active]||[];d[active].unshift({text:value,done:false,date:new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'}).format(new Date())});save(d);input.value='';renderItems();showToast('Guardado en tu habitación')});
document.querySelector('#close').addEventListener('click',()=>{panel.classList.remove('open');active=null});
function project(v){return v.clone().project(camera)}
function makeLabels(){labels.innerHTML='';for(const [id,def] of objectDefs){const el=document.createElement('div');el.className='tag';el.textContent=def[1];labels.append(el);labelsMap[id]=el}}
makeLabels();
function positionLabels(){for(const [id,[g,p]] of Object.entries(targets)){const el=labelsMap[id];const q=project(p);const x=(q.x*.5+.5)*innerWidth,y=(-q.y*.5+.5)*innerHeight;const visible=q.z<1&&q.z>-1&&x>0&&x<innerWidth&&y>0&&y<innerHeight;el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=visible?(active===id?'0':'1'):'0'}}
function choose(clientX,clientY){pointer.x=clientX/innerWidth*2-1;pointer.y=-(clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(clickables,false);if(hits.length){const id=hits[0].object.userData.targetId;if(id)openPanel(id)}}
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;drag={x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down||panel.classList.contains('open'))return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>5)drag.moved=true;lastX=e.clientX;lastY=e.clientY;if(drag.moved){camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.004);camera.position.y=Math.max(3.4,Math.min(9,camera.position.y+dy*.012));camera.lookAt(0,1.6,0)}});
canvas.addEventListener('pointerup',e=>{if(down&&drag&&!drag.moved&&!panel.classList.contains('open'))choose(e.clientX,e.clientY);down=false;drag=null});
canvas.addEventListener('wheel',e=>{if(panel.classList.contains('open'))return;camera.position.multiplyScalar(e.deltaY>0?1.06:.94);const len=camera.position.length();if(len<8)camera.position.setLength(8);if(len>17)camera.position.setLength(17);camera.lookAt(0,1.6,0)},{passive:true});
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;cyan.intensity=20+Math.sin(t*1.4)*2;violet.intensity=17+Math.sin(t*1.1+1)*2;renderer.render(scene,camera);positionLabels()}animate();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
</script></body></html>
